server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/my-app-db
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/data.sql

logging:
  level:
    org.springframework.integration: INFO
    org.springframework.security: INFO
    org.springframework.transaction: DEBUG
    com.example.integration: DEBUG

demo:
  local:
    watch-dir: C:/Users/kspar/Downloads/integration-temp/local-watch
    age-threshold-seconds: 5
    polling-rate-ms: 1000

  sftp:
    host: localhost
    port: 22
    username: tester
    password: password
    local-download-dir: C:/Users/kspar/Downloads/integration-temp/sftp-download
    remote-watch-dir: upload
    remote-upload-dir: incoming
    temp-file-suffix: .writing
    polling-rate-ms: 2000

  tcp:
    server:
      port: 9999
    client:
      host: localhost
      port: 9999
      timeout-ms: 5000

  db:
    polling-rate-ms: 5000
    export-temp-dir: C:/Users/kspar/Downloads/integration-temp/db-export
