server:
  port: 8080

spring:
  datasource:
    # PostgreSQL 접속 정보 예시 (로컬 환경에 맞춰 변경하여 사용)
    url: jdbc:postgresql://localhost:5432/my-app-db
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      # 로컬 개발 및 테스트 편의를 위해 시작 시 DB 스키마 초기화 모드 설정 (필요시 'never'로 변경)
      mode: always
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/data.sql

logging:
  level:
    org.springframework.integration: INFO
    org.springframework.transaction: DEBUG
    com.example.integration: DEBUG

# Spring Integration Demo Configuration
demo:
  # 1. Local Folder Watcher Settings
  local:
    watch-dir: C:/Users/kspar/Downloads/integration-temp/local-watch
    # 파일이 복사/작성 중인지 판단하기 위한 임계 시간 (초 단위).
    # 마지막 수정 시각이 현재 시각보다 'age-threshold-seconds' 초 이전인 파일만 완성된 파일로 간주합니다.
    age-threshold-seconds: 5
    # 폴링 주기 (밀리초)
    polling-rate-ms: 1000

  # 2 & 3. SFTP Connection & Watcher Settings
  sftp:
    host: localhost
    port: 22
    username: tester
    password: password
    # local-download-dir: 원격 SFTP에서 다운로드받은 파일을 저장할 로컬 경로
    local-download-dir: C:/Users/kspar/Downloads/integration-temp/sftp-download
    # remote-watch-dir: 감시할 원격 SFTP 디렉터리
    remote-watch-dir: upload
    # remote-upload-dir: local-watch 등에서 SFTP 전송 시 보낼 원격 디렉터리
    remote-upload-dir: incoming
    # 임시 업로드 시 사용할 파일 확장자 필터 (안전한 다운로드를 위한 규칙)
    # 예: 업로드 중에는 '.writing'을 붙이고 완료되면 제거하는 정책
    temp-file-suffix: .writing
    polling-rate-ms: 2000

  # 4. TCP/IP Configuration
  tcp:
    server:
      port: 9999
    client:
      host: localhost
      port: 9999
      # TCP 응답 대기 타임아웃 (ms)
      timeout-ms: 5000

  # 5 & 6. Database Integration Settings
  db:
    # DB 조회 폴링 주기 (밀리초)
    polling-rate-ms: 5000
    # 내보낼 CSV 임시 저장 경로
    export-temp-dir: C:/Users/kspar/Downloads/integration-temp/db-export
