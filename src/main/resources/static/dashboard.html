<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inbound Adapter Monitoring Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        html, body { height: 100%; overflow: hidden; }
        @keyframes pulse-ring {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.4); opacity: 0; }
            100% { transform: scale(0.95); opacity: 0; }
        }
        .live-dot::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background-color: currentColor;
            animation: pulse-ring 2s cubic-bezier(0.455, 0.03, 0.515, 0.955) infinite;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans h-screen flex flex-col antialiased">

    <!-- Toast Container -->
    <div id="toastContainer" class="fixed top-4 right-4 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <!-- Header -->
    <header class="bg-slate-800/80 backdrop-blur-md border-b border-slate-700/50 shrink-0">
        <div class="max-w-screen-2xl mx-auto px-6 py-3 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="p-1.5 bg-indigo-600/10 text-indigo-400 rounded-lg border border-indigo-500/20">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
                    </svg>
                </div>
                <div>
                    <h1 class="text-base font-bold text-white leading-tight">Inbound Adapter Monitoring Dashboard</h1>
                    <p class="text-[10px] text-slate-400">Spring Integration 인바운드 어댑터 실시간 상태 제어</p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="fetchAdapters()" class="inline-flex items-center gap-1.5 px-3 py-1.5 bg-slate-700/80 hover:bg-slate-700 text-slate-200 text-xs font-medium rounded-lg border border-slate-600/50 transition">
                    <svg id="refreshIcon" class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
                    </svg>
                    새로고침
                </button>
                <form action="/logout" method="post" class="inline">
                    <button type="submit" class="inline-flex items-center gap-1.5 px-3 py-1.5 bg-rose-600/10 hover:bg-rose-600/20 text-rose-400 border border-rose-500/20 text-xs font-medium rounded-lg transition">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
                        </svg>
                        로그아웃
                    </button>
                </form>
            </div>
        </div>
    </header>

    <!-- Main Content (fills remaining height) -->
    <main class="flex-1 flex flex-col max-w-screen-2xl mx-auto w-full px-6 py-4 gap-4 min-h-0">

        <!-- KPI Cards Row -->
        <div class="grid grid-cols-3 gap-4 shrink-0">
            <!-- Total -->
            <div class="bg-slate-800/60 border border-slate-700/50 rounded-xl px-5 py-4 flex items-center justify-between shadow-lg">
                <div>
                    <p class="text-[10px] font-semibold text-slate-400 uppercase tracking-wider">전체 어댑터 수</p>
                    <h2 id="kpiTotal" class="text-2xl font-extrabold text-white mt-1">0</h2>
                </div>
                <div class="p-2.5 bg-blue-500/10 text-blue-400 rounded-lg border border-blue-500/20">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/>
                    </svg>
                </div>
            </div>
            <!-- Running -->
            <div class="bg-slate-800/60 border border-slate-700/50 rounded-xl px-5 py-4 flex items-center justify-between shadow-lg">
                <div>
                    <p class="text-[10px] font-semibold text-slate-400 uppercase tracking-wider">가동 중 (RUNNING)</p>
                    <h2 id="kpiRunning" class="text-2xl font-extrabold text-emerald-400 mt-1">0</h2>
                </div>
                <div class="p-2.5 bg-emerald-500/10 text-emerald-400 rounded-lg border border-emerald-500/20 relative">
                    <span class="absolute top-1.5 right-1.5 w-2 h-2 bg-emerald-400 rounded-full live-dot"></span>
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"/>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                    </svg>
                </div>
            </div>
            <!-- Stopped -->
            <div class="bg-slate-800/60 border border-slate-700/50 rounded-xl px-5 py-4 flex items-center justify-between shadow-lg">
                <div>
                    <p class="text-[10px] font-semibold text-slate-400 uppercase tracking-wider">정지됨 (STOPPED)</p>
                    <h2 id="kpiStopped" class="text-2xl font-extrabold text-rose-400 mt-1">0</h2>
                </div>
                <div class="p-2.5 bg-rose-500/10 text-rose-400 rounded-lg border border-rose-500/20">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 9v6m4-6v6m7-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
                    </svg>
                </div>
            </div>
        </div>

        <!-- Data Table Card (fills remaining space) -->
        <div class="bg-slate-800/60 border border-slate-700/50 rounded-xl shadow-xl flex flex-col min-h-0 flex-1">
            <!-- Table Header -->
            <div class="px-5 py-3 border-b border-slate-700/50 flex items-center justify-between shrink-0">
                <div>
                    <h3 class="text-sm font-bold text-white">인바운드 어댑터 리스트 (Inbound Adapter List)</h3>
                    <p class="text-[10px] text-slate-400 mt-0.5">사용자 정의 IntegrationFlow 기준 · 3초 주기 동기화</p>
                </div>
                <span class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full text-[10px] font-medium bg-indigo-500/10 text-indigo-400 border border-indigo-500/20">
                    <span class="w-1.5 h-1.5 rounded-full bg-indigo-400 animate-pulse"></span>
                    Live Sync
                </span>
            </div>

            <!-- Table Body (scrollable if needed) -->
            <div class="overflow-auto flex-1">
                <table class="w-full text-left border-collapse">
                    <thead class="sticky top-0 z-10">
                        <tr class="bg-slate-900/80 text-slate-400 text-[11px] font-semibold uppercase tracking-wider border-b border-slate-700/50">
                            <th class="py-3 px-5 w-[22%]">Adapter Name</th>
                            <th class="py-3 px-5 w-[18%]">Adapter Type</th>
                            <th class="py-3 px-5 w-[12%]">Status</th>
                            <th class="py-3 px-5 w-[10%] text-right">Total Count</th>
                            <th class="py-3 px-5 w-[22%]">Last Executed Time</th>
                            <th class="py-3 px-5 w-[16%] text-center">Action</th>
                        </tr>
                    </thead>
                    <tbody id="adapterTableBody" class="divide-y divide-slate-700/30 text-[13px]">
                        <tr>
                            <td colspan="6" class="py-10 text-center text-slate-500">
                                <div class="inline-flex items-center gap-2">
                                    <svg class="animate-spin h-4 w-4 text-indigo-400" viewBox="0 0 24 24" fill="none">
                                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
                                    </svg>
                                    <span class="text-xs">어댑터 정보 로딩 중...</span>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        const API_URL = '/api/dashboard/adapters';

        async function fetchAdapters() {
            const icon = document.getElementById('refreshIcon');
            icon.classList.add('animate-spin');
            try {
                const res = await fetch(API_URL);
                if (!res.ok) throw new Error('API error: ' + res.status);
                renderDashboard(await res.json());
            } catch (err) {
                console.error(err);
                showToast('어댑터 정보를 불러오지 못했습니다.', 'error');
            } finally {
                setTimeout(() => icon.classList.remove('animate-spin'), 400);
            }
        }

        function renderDashboard(adapters) {
            const tbody = document.getElementById('adapterTableBody');
            const total = adapters.length;
            let running = 0, stopped = 0;

            if (total === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="py-8 text-center text-slate-400 text-xs">등록된 인바운드 어댑터가 없습니다.</td></tr>`;
                updateKPI(0, 0, 0);
                return;
            }

            tbody.innerHTML = adapters.map(a => {
                const isRunning = a.status === 'RUNNING';
                if (isRunning) running++; else stopped++;
                const controlName = a.controlName || a.name;

                const badge = isRunning
                    ? `<span class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-[11px] font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                        <span class="relative flex h-2 w-2"><span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span><span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span></span>
                        RUNNING</span>`
                    : `<span class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-[11px] font-semibold bg-rose-500/10 text-rose-400 border border-rose-500/20">
                        <span class="h-2 w-2 rounded-full bg-rose-500"></span>STOPPED</span>`;

                const btn = isRunning
                    ? `<button onclick="controlAdapter('${esc(controlName)}','stop')" class="px-3 py-1 text-[11px] font-semibold rounded-md bg-rose-600/15 hover:bg-rose-600/25 text-rose-300 border border-rose-500/25 transition inline-flex items-center gap-1 mx-auto">
                        <svg class="w-3 h-3" fill="currentColor" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1"/></svg>Stop</button>`
                    : `<button onclick="controlAdapter('${esc(controlName)}','start')" class="px-3 py-1 text-[11px] font-semibold rounded-md bg-emerald-600/15 hover:bg-emerald-600/25 text-emerald-300 border border-emerald-500/25 transition inline-flex items-center gap-1 mx-auto">
                        <svg class="w-3 h-3" fill="currentColor" viewBox="0 0 24 24"><polygon points="6,4 20,12 6,20"/></svg>Start</button>`;

                return `<tr class="hover:bg-slate-800/40 transition">
                    <td class="py-2.5 px-5 font-mono text-xs font-medium text-slate-200">${esc(a.name)}</td>
                    <td class="py-2.5 px-5 text-slate-400 text-xs">${esc(a.type)}</td>
                    <td class="py-2.5 px-5">${badge}</td>
                    <td class="py-2.5 px-5 text-right font-mono font-semibold text-indigo-300">${a.totalCount.toLocaleString()}</td>
                    <td class="py-2.5 px-5 text-slate-400 text-xs font-mono">${esc(a.lastExecutedTime)}</td>
                    <td class="py-2.5 px-5 text-center">${btn}</td>
                </tr>`;
            }).join('');

            updateKPI(total, running, stopped);
        }

        function updateKPI(t, r, s) {
            document.getElementById('kpiTotal').textContent = t;
            document.getElementById('kpiRunning').textContent = r;
            document.getElementById('kpiStopped').textContent = s;
        }

        async function controlAdapter(name, action) {
            showToast(`[${name}] ${action.toUpperCase()} 명령 전송 중...`, 'info');
            try {
                const res = await fetch(`/api/dashboard/adapters/${encodeURIComponent(name)}/${action}`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' }
                });
                const result = await res.json();
                if (res.ok && result.success) {
                    showToast(`[${name}] ${action.toUpperCase()} 성공`, 'success');
                    setTimeout(fetchAdapters, 300);
                } else {
                    showToast(`제어 실패: ${result.message}`, 'error');
                }
            } catch (err) {
                showToast('제어 중 오류가 발생했습니다.', 'error');
            }
        }

        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const bg = type === 'success' ? 'bg-emerald-600/90 border-emerald-500' :
                       type === 'error' ? 'bg-rose-600/90 border-rose-500' : 'bg-indigo-600/90 border-indigo-500';
            const toast = document.createElement('div');
            toast.className = `pointer-events-auto px-4 py-2.5 rounded-lg border ${bg} text-white shadow-xl text-[11px] font-medium transition duration-300 transform translate-y-2 opacity-0 max-w-sm`;
            toast.textContent = message;
            container.appendChild(toast);
            requestAnimationFrame(() => toast.classList.remove('translate-y-2', 'opacity-0'));
            setTimeout(() => { toast.classList.add('opacity-0', 'translate-y-2'); setTimeout(() => toast.remove(), 300); }, 3000);
        }

        function esc(s) { return s ? String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;') : ''; }

        fetchAdapters();
        setInterval(fetchAdapters, 3000);
    </script>
</body>
</html>
